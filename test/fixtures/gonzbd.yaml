# Sample gonzbd configuration covering every section the loader
# understands. Used by TestRoundTripFixture to ensure the on-disk schema
# stays stable.
general:
  host: 127.0.0.1
  port: 4289
  https_port: 0
  https_cert: ""
  https_key: ""
  api_key: 0123456789abcdef
  nzb_key: fedcba9876543210
  # Client IP ranges trusted for the web session cookie, in addition to
  # loopback. Empty = loopback-only. See gonzbd.yaml.example for details.
  local_ranges:
    - 192.168.0.0/16
    - 10.0.0.0/8
  verify_xff_header: false

  download_dir: Downloads/incomplete
  complete_dir: Downloads/complete
  dirscan_dir: Downloads/watch
  dirscan_speed: 5
  script_dir: scripts
  log_dir: logs
  admin_dir: admin
  # Days to keep a finished job in history; 0 keeps it forever. Deleting a
  # history entry also releases its retained per-file progress and its NZB
  # backup under admin/nzb/, so a pruned job can no longer be retried.
  history_retention_days: 0
  # Same threshold for jobs that failed, kept separate so a failure can
  # outlive a success. 0 keeps failed jobs forever.
  history_failed_retention_days: 0
  log_level: info
  log_levels:
    api: warn
    downloader: debug
    assembler: debug
  language: en

downloads:
  bandwidth_max: 50M
  bandwidth_perc: 100
  min_free_space: 1024M
  max_art_tries: 3
  max_art_opt: 1
  max_active_jobs: 4
  max_compute_slots: 2
  checkpoint_interval: 30
  checkpoint_bytes: 64M
  top_only: false
  no_penalties: false
  pre_check: false
  propagation_delay: 0

postproc:
  enable_unrar: true
  enable_7zip: true
  enable_tar: true
  enable_filejoin: true
  enable_tsjoin: true
  enable_recursive: true
  enable_par_cleanup: true
  enable_rar_cleanup: true
  process_unpacked_par2: true
  enable_rar_volume_recovery: true
  par2_command: par2
  unrar_command: ""
  sevenz_command: ""
  par2_turbo: false
  # Maximum payload size (in bytes) of a single PAR2 packet body (default: 67108864 [64 MiB], min: 65536 [64 KiB]; 0 or below-floor uses the default). Prevents OOM on corrupt files.
  par2_max_packet_body_size: 67108864
  # Maximum forward search distance (in bytes) when scanning for PAR2 magic headers (default: 65536 [64 KiB], min: 1024 [1 KiB]; 0 or below-floor uses the default).
  par2_max_junk_scan_bytes: 65536
  ignore_unrar_dates: false
  overwrite_files: false
  use_go_rar: true
  use_go_7z: true
  flat_unpack: false
  direct_unpack: false
  direct_unpack_threads: 3
  strict_sandbox: true
  deobfuscate_filenames: true
  ignore_samples: false
  cleanup_extensions: []
  folder_rename: false
  nice: ""
  ionice: ""
  permissions: ""
  password_file: ""
  extra_unrar_params: ""
  extra_par2_params: ""
  script_can_fail: false
  redact_script_secrets: false

servers:
  - name: primary
    host: news.example.com
    port: 563
    username: user
    password: secret
    connections: 8
    ssl: true
    ssl_verify: 2
    ssl_ciphers: ""
    priority: 0
    required: true
    optional: false
    retention: 0
    timeout: 60
    pipelining_requests: 2
    enable: true
  - name: backup
    host: backup.example.com
    port: 563
    username: user2
    password: secret2
    connections: 4
    ssl: true
    ssl_verify: 2
    ssl_ciphers: ""
    priority: 1
    required: false
    optional: true
    retention: 1500
    timeout: 60
    pipelining_requests: 2
    enable: true

categories:
  - name: Default
    pp: 3
    script: None
    priority: 0
    dir: ""
  - name: "*"
    pp: 3
    script: None
    priority: 0
    dir: ""
  - name: tv
    pp: 3
    script: None
    priority: 0
    dir: TV

# Notifications configuration (optional).
# Controls notification sinks for system events.
notifications:
  # Email notification settings (SMTP).
  email:
    enable: false
    host: "smtp.example.com"
    port: 587
    username: ""
    password: ""
    from: "gonzbd@example.com"
    to:
      - "admin@example.com"
    use_tls: true
    use_ssl: false
    # List of events to notify on. Empty or omitted means all events.
    # Valid events: DownloadStarted, DownloadComplete, DownloadFailed,
    # PostProcessingComplete, PostProcessingFailed, DiskFull, QueueDone, Warning, Error.
    events: []

  # Apprise notifications.
  apprise:
    enable: false
    # URL of a local Apprise API instance or similar service endpoint.
    url: ""
    service_url: ""
    events: []

  # Custom script notification.
  script:
    enable: false
    # Path to the script. Can be relative to configuration dir or absolute.
    # Environment variables and leading ~ are expanded.
    path: ""
    timeout: 30
    events: []

