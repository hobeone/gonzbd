# Sample gonzbd configuration covering every section the loader
# understands. Used by TestRoundTripFixture to ensure the on-disk schema
# stays stable.
general:
  host: 127.0.0.1
  port: 4289
  https_port: 0
  https_cert: ""
  https_key: ""
  api_key: 0123456789abcdef
  nzb_key: fedcba9876543210
  username: admin
  password: ""
  download_dir: Downloads/incomplete
  complete_dir: Downloads/complete
  dirscan_dir: Downloads/watch
  dirscan_speed: 5
  script_dir: scripts
  log_dir: logs
  admin_dir: admin
  log_level: info
  log_levels:
    api: warn
    downloader: debug
    assembler: debug
  language: en

downloads:
  bandwidth_max: 50M
  bandwidth_perc: 100
  min_free_space: 1024M
  max_art_tries: 3
  max_art_opt: 1
  top_only: false
  no_penalties: false
  pre_check: false
  propagation_delay: 0

postproc:
  enable_unrar: true
  enable_7zip: true
  enable_filejoin: true
  enable_tsjoin: true
  enable_recursive: true
  enable_par_cleanup: true
  enable_rar_cleanup: true
  process_unpacked_par2: true
  par2_command: par2
  unrar_command: ""
  sevenz_command: ""
  par2_turbo: false
  ignore_unrar_dates: false
  overwrite_files: false
  use_go_rar: true
  use_go_7z: true
  flat_unpack: false
  direct_unpack: false
  direct_unpack_threads: 3
  deobfuscate_filenames: true
  ignore_samples: false
  cleanup_extensions: []
  folder_rename: false
  nice: ""
  ionice: ""
  permissions: ""
  password_file: ""
  extra_unrar_params: ""
  extra_par2_params: ""
  script_can_fail: false

servers:
  - name: primary
    host: news.example.com
    port: 563
    username: user
    password: secret
    connections: 8
    ssl: true
    ssl_verify: 2
    ssl_ciphers: ""
    priority: 0
    required: true
    optional: false
    retention: 0
    timeout: 60
    pipelining_requests: 2
    enable: true
  - name: backup
    host: backup.example.com
    port: 563
    username: user2
    password: secret2
    connections: 4
    ssl: true
    ssl_verify: 2
    ssl_ciphers: ""
    priority: 1
    required: false
    optional: true
    retention: 1500
    timeout: 60
    pipelining_requests: 2
    enable: true

categories:
  - name: Default
    pp: 3
    script: None
    priority: 0
    dir: ""
  - name: "*"
    pp: 3
    script: None
    priority: 0
    dir: ""
  - name: tv
    pp: 3
    script: None
    priority: 0
    dir: TV

schedules:
  - name: nightly-resume
    enabled: true
    action: resume
    arguments: ""
    minute: "0"
    hour: "1"
    dayofweek: "*"

rss:
  - name: example-feed
    uri: https://example.com/rss
    cat: tv
    pp: ""
    script: ""
    enable: true
    priority: 0
    filters:
      - name: tv-only
        enabled: true
        title: "(?i)s\\d+e\\d+"
        body: ""
        cat: tv
        pp: ""
        script: ""
        priority: 0
        type: require
        size_from: 100M
        size_to: 5G
        age: 7
