# Docker Compose configuration for GoNZBD
#
# Quick start:
#   1. Copy this file to your preferred location
#   2. Edit the volumes, PUID/PGID, and TZ below
#   3. Run: docker compose up -d
#
# First run creates a default config at /config/gonzbd.yaml inside the
# container. Edit it (or the mounted host copy) to add your news servers,
# then restart: docker compose restart gonzbd

services:
  gonzbd:
    image: gonzbd:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "1.0.0"
    container_name: gonzbd
    restart: unless-stopped
    stop_grace_period: 75s

    # Port mapping: <host>:<container>
    # Change the left side to use a different host port.
    # The container listens on GONZBD_PORT (default 4289).
    ports:
      # Web UI + API
      - "4289:4289"
      # HTTPS — uncomment and set https_port + https_cert/https_key
      # in gonzbd.yaml. Pick any host port you like.
      # - "8443:8443"

    volumes:
      # Config file — persists your settings across container rebuilds.
      # On first run, gonzbd creates a default config here automatically.
      - ./config:/config

      # Download directories — these should be on fast storage.
      # incomplete: active downloads (high I/O, temporary files)
      # complete:   finished downloads moved here after post-processing
      - ./downloads/incomplete:/data/downloads
      - ./downloads/complete:/data/complete

      # Admin directory — internal state (queue, history DB, locks).
      # Small but important — back this up to preserve download history.
      - ./admin:/data/admin

      # Watched folder (optional) — drop .nzb files here to auto-download.
      # Uncomment and set dirscan_dir in gonzbd.yaml to /data/watch
      # - ./watch:/data/watch

      # Scripts (optional) — post-processing scripts.
      # Uncomment and set script_dir in gonzbd.yaml to /data/scripts
      # - ./scripts:/data/scripts

    environment:
      # Run as this user/group ID. Set these to match your host user
      # so downloaded files have the correct ownership. Find your IDs
      # with: id $USER
      - PUID=1000
      - PGID=1000

      # Timezone — used for scheduled actions and log timestamps.
      - TZ=America/Los_Angeles

      # Internal listen port (default 4289). Change this if you need
      # a different container-side port. Must match the right side of ports:.
      # - GONZBD_PORT=4289

    # Resource limits (optional but recommended)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2G
    #     reservations:
    #       memory: 512M

    # Lower CPU and I/O scheduling priority (nice & ionice)
    # Requires SYS_NICE capability. Prepending to entrypoint ensures they run
    # as root before the entrypoint drops privileges to the gonzbd user.
    # cap_add:
    #   - SYS_NICE
    # entrypoint: ["nice", "-n", "19", "ionice", "-c", "3", "/entrypoint.sh"]

    # Health check — verifies the API is responding.
    # Uses shell form so $GONZBD_PORT is expanded at runtime.
    healthcheck:
      test: wget --spider -q http://localhost:$${GONZBD_PORT:-4289}/api?mode=version&output=json
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
