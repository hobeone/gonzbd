version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration
    - uitest
    - crash

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - nilerr
    - prealloc
    - revive
    - wastedassign
    - modernize
    - ireturn
    - intrange
    - iface
    - gocritic
    - sloglint
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      # Discarding these errors is correct by category, so each call site
      # would otherwise carry the same //nolint reason. Each close below
      # releases a read-side or abandon-side handle, so nothing written is
      # lost when it fails; errors.AsType is listed for the reason on its
      # line. (*os.File).Close and os.Remove/RemoveAll are deliberately
      # absent — a close after a write and a removal that matters must stay
      # visible at the call site.
      exclude-functions:
        - (*os.Root).Close              # a directory handle; nothing buffered
        - (*database/sql.Rows).Close    # read cursor; rows.Err() carries iteration errors
        - (*database/sql.Tx).Rollback   # deferred after Commit; ErrTxDone on the success path
        - (*database/sql.Stmt).Close    # prepared statement; the Tx owns the outcome
        - (io.ReadCloser).Close         # read side (HTTP response bodies, readers)
        - (*compress/gzip.Reader).Close # read side; the checksum error surfaces from Read
        - errors.AsType                 # the discarded first result is the matched error itself
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
        - rangeValCopy
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false
        - name: var-naming
        - name: unused-parameter
          disabled: true
    gosec:
      excludes:
        - G104  # handled by errcheck
  exclusions:
    paths:
      - node_modules
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - gocritic
          - unparam
      # The crash-consistency harness is test code behind the crash build
      # tag rather than a _test.go file, so the rule above cannot reach it.
      - path: ^test/crash/
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hobeone/gonzbd

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
