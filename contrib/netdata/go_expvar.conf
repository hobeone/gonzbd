# netdata python.d go_expvar configuration for GoNZBD
# -----------------------------------------------------------------------------
# Copy this to: /etc/netdata/python.d/go_expvar.conf
# Then restart netdata:  sudo systemctl restart netdata
#
# This collects the expvar counters GoNZBD publishes at /debug/vars and renders
# them as dashboard charts. The endpoint is served on the same host:port as the
# API (default 127.0.0.1:4289); adjust `url` if you changed general.host /
# general.port in gonzbd.yaml or passed --listen.
#
# IMPORTANT semantics (see internal/telemetry/telemetry.go and the assembler):
#   * assembler_disk_writes / assembler_disk_write_bytes are TOTALS — they count
#     every WriteAt syscall, which includes (a) cache-disabled direct writes,
#     (b) coalesced contiguous-run flushes, and (c) cache drains at file
#     completion / memory pressure / shutdown.
#   * assembler_cache_flushes / assembler_cache_flush_bytes are a SUBSET of the
#     above (the coalesced-flush portion). Each coalesced flush increments BOTH
#     the cache_flush* counter and the disk_write* counter.
#
#   => Because the cache_flush* values are already contained in the disk_write*
#      totals, these dimensions must NOT be drawn on a stacked chart
#      (chart_type: area / stacked) or throughput is double-counted. Use
#      chart_type: line so each is plotted independently (subset under total).
# -----------------------------------------------------------------------------

    gonzbd:
      name: 'gonzbd'
      url: 'http://127.0.0.1:4289/debug/vars'
      collect_memstats: true
      extra_charts:
        # --- Pipeline -------------------------------------------------------
        - id: "gonzbd_pipeline_articles"
          options:
            name: pipeline_articles
            title: "GoNZBD Pipeline Article Throughput"
            units: articles/s
            family: pipeline
            context: gonzbd.pipeline.articles
            chart_type: line
          lines:
            - expvar_key: pipeline_articles_received
              expvar_type: int
              id: received
              algorithm: incremental
            - expvar_key: pipeline_articles_written
              expvar_type: int
              id: written
              algorithm: incremental
            - expvar_key: pipeline_articles_retried
              expvar_type: int
              id: retried
              algorithm: incremental
            - expvar_key: pipeline_articles_failed
              expvar_type: int
              id: failed
              algorithm: incremental

        # --- Assembler: disk operations -------------------------------------
        # disk_writes is the TOTAL WriteAt syscall rate. cache_flushes is the
        # coalesced-flush subset of it; prealloc_calls is fallocate/ftruncate.
        # Kept as a (non-stacked) line chart so the subset reads correctly.
        - id: "gonzbd_assembler_disk_ops"
          options:
            name: assembler_disk_ops
            title: "GoNZBD Assembler Disk Ops (writes=total WriteAt; flushes=coalesced subset)"
            units: ops/s
            family: assembler
            context: gonzbd.assembler.disk_ops
            chart_type: line
          lines:
            - expvar_key: assembler_disk_writes
              expvar_type: int
              id: disk_writes
              algorithm: incremental
            - expvar_key: assembler_cache_flushes
              expvar_type: int
              id: cache_flushes
              algorithm: incremental
            - expvar_key: assembler_prealloc_calls
              expvar_type: int
              id: prealloc_calls
              algorithm: incremental

        # --- Assembler: disk write throughput -------------------------------
        # disk_write_bytes is TOTAL bytes hitting disk. flush_bytes is the
        # coalesced subset already included in it. MUST be a line chart (not
        # area/stacked) to avoid double-counting the flush bytes.
        - id: "gonzbd_assembler_disk_bytes"
          options:
            name: assembler_disk_bytes
            title: "GoNZBD Assembler Disk Write Throughput (total vs coalesced subset)"
            units: bytes/s
            family: assembler
            context: gonzbd.assembler.disk_bytes
            chart_type: line
          lines:
            - expvar_key: assembler_disk_write_bytes
              expvar_type: int
              id: disk_write_bytes
              algorithm: incremental
            - expvar_key: assembler_cache_flush_bytes
              expvar_type: int
              id: coalesced_flush_bytes
              algorithm: incremental

        # --- Assembler: write cache activity --------------------------------
        - id: "gonzbd_assembler_cache"
          options:
            name: assembler_cache
            title: "GoNZBD Write Cache Activity"
            units: events/s
            family: assembler
            context: gonzbd.assembler.cache
            chart_type: line
          lines:
            - expvar_key: assembler_cache_hits
              expvar_type: int
              id: cache_hits
              algorithm: incremental
            - expvar_key: assembler_cache_pressure_flushes
              expvar_type: int
              id: pressure_flushes
              algorithm: incremental

        # --- Assembler: file completions ------------------------------------
        - id: "gonzbd_assembler_completions"
          options:
            name: assembler_completions
            title: "GoNZBD Files Completed"
            units: files/s
            family: assembler
            context: gonzbd.assembler.completions
            chart_type: line
          lines:
            - expvar_key: assembler_files_completed
              expvar_type: int
              id: completed
              algorithm: incremental
