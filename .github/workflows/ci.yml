name: CI

# Manual-dispatch only. This workflow does NOT run automatically on push or
# pull_request. Every gate below is run locally before each push, where it is
# substantially faster than a runner; see the "Continuous Integration" section
# of AGENTS.md for the rationale and for how to trigger a run deliberately.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # check_test_alignment and check_coverage diff against
          # origin/main...HEAD; with the default fetch-depth of 1 that ref
          # does not resolve and both tools silently degrade to no-ops.
          fetch-depth: 0

      - name: Fetch main for diff-scoped gates
        # The refspec must be fully qualified. With an unqualified source
        # ("main:refs/..."), a fetcher configured with fetch.prune=true prunes
        # refs/remotes/origin/main instead of updating it, so the diff-scoped
        # gates silently fall back to HEAD~1. Runners do not set fetch.prune,
        # but developers commonly do, and the two must not diverge.
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Type-check UI
        working-directory: ui
        run: bun run check

      - name: Build UI
        working-directory: ui
        run: bun run build

      - name: Run UI tests
        working-directory: ui
        run: bun run test

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Go dependencies
        run: go mod download

      - name: Install archive tools (unrar, rar, par2, p7zip)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unrar rar par2 p7zip-full

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # .golangci.yml is a version:"2" config, so this needs a v2 binary.
          # It must also be built with Go >= the go.mod version, or it fails to
          # load the config at all (a startup error, not a lint finding).
          version: v2.13.1

      # Whole-repository, not diff-scoped, and each catches a class that build,
      # vet, lint and the test suite are structurally blind to: comments and
      # Markdown are neither type-checked nor executed. AGENTS.md has listed
      # them as required gates since they were written; their absence here is
      # why a defect in check_dup_comments' own marker handling sat in the tree
      # until someone ran it by hand.
      - name: Duplicated comment block check
        run: go run ./scripts/check_dup_comments

      - name: Review banner check
        run: go run ./scripts/check_review_banner

      - name: Check citation counts
        run: go run ./scripts/check_citations

      - name: Mutex-held-during-I/O check
        run: go run scripts/check_lock_io/main.go

      - name: Test alignment check
        run: go run scripts/check_test_alignment/main.go --min-complexity=8

      - name: Run tests
        run: go test -race ./...

      - name: Run integration tests
        run: go test -tags=integration ./test/integration/...

      # Runs `go test -coverprofile` per changed package, so it is the slowest
      # gate — keep it last so cheaper checks fail first.
      - name: Coverage check
        run: go run scripts/check_coverage/main.go
