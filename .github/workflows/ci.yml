name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Type-check UI
        working-directory: ui
        run: bun run check

      - name: Build UI
        working-directory: ui
        run: bun run build

      - name: Run UI tests
        working-directory: ui
        run: bun run test

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install post-processing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar p7zip-full par2

      - name: Install Go dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

      - name: Run integration tests
        run: go test -v -tags=integration ./test/integration/...

      - name: Verify modules
        run: go mod verify

      - name: Verify go mod tidy
        run: go mod tidy && git diff --exit-code
