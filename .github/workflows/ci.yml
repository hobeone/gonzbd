name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Type-check UI
        working-directory: ui
        run: bun run check

      - name: Build UI
        working-directory: ui
        run: bun run build

      - name: Run UI tests
        working-directory: ui
        run: bun run test

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Go dependencies
        run: go mod download

      - name: Install archive tools (unrar, rar, par2, p7zip)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unrar rar par2 p7zip-full

      - name: Run tests
        run: go test ./...

      - name: Run integration tests
        run: go test -tags=integration ./test/integration/...
