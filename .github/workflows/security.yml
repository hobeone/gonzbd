name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
           # The action defaults to the latest stable Go with GOTOOLCHAIN=local,
           # so a go.mod ahead of that fails to load. Read it from go.mod like
           # ci.yml, codeql.yml and release.yml do.
           go-version-file: go.mod
           go-package: ./...
